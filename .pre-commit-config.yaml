repos:
  - repo: local
    hooks:
      - id: sync-plugin-versions
        name: Sync plugin versions
        entry: python3 scripts/sync-plugin-versions.py
        language: system
        pass_filenames: false
        always_run: true
      - id: verify-ruff-version
        name: Verify Ruff version alignment
        entry: python3 scripts/verify-ruff-version.py
        language: system
        pass_filenames: false
        always_run: true
      - id: commitlint
        name: Commitlint
        entry: bash -lc 'npx --yes --package=@commitlint/cli --package=@commitlint/config-conventional -- commitlint --edit "$1" --config .commitlintrc.json' --
        language: system
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
        # Catch markers even outside an in-progress merge (e.g. committing a
        # botched conflict resolution from a rebase). CI re-checks this
        # unconditionally, so installing hooks is not required for enforcement.
        args: [--assume-in-merge]
        # headroom/plugins/ ships skill files verbatim from Christopher's own
        # ~/.claude/skills/ -- excluded so this hook never flags conflict-
        # marker-shaped text in a skill's own docs as a real conflict.
        exclude: ^headroom/plugins/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(experiments|headroom/plugins)/
      - id: ruff-format
        exclude: ^(experiments|headroom/plugins)/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        # `entry: mypy headroom` + pass_filenames: false means this hook
        # always runs the whole-package command regardless of `exclude` --
        # the real exclusion is `[tool.mypy] exclude` in pyproject.toml.
        # Kept here too so the hook's own config states the same thing.
        exclude: ^(experiments|headroom/plugins)/
        pass_filenames: false
        entry: mypy headroom
